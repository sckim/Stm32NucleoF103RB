[platformio]
# CubeMX가 생성한 소스/헤더 위치 지정
src_dir = Core/Src
include_dir = Core/Inc

[env:nucleo_f103rb]
platform = ststm32
board = nucleo_f103rb
; board = genericSTM32F103R6
framework = stm32cube

build_type = debug
# -----------------------------------------------------------------
# 시리얼 모니터 관련 직접 설정 구역
# -----------------------------------------------------------------
# 모니터링할 포트를 COM5로 강제 지정
monitor_port = COM5

# 통신 속도 지정 (앞서 터미널이 9600이었으므로 9600 지정, printf 연동 시 115200 권장)
monitor_speed = 115200

; [platformio]
; # 사용자가 작성한 메인 소스 위치 지정
; src_dir = src
; include_dir = include

; # 'pio run -t upload' 처럼 env 를 지정하지 않았을 때 사용할 기본 보드
; default_envs = Lecture

; # -----------------------------------------------------------------
; # 공통 설정: 아래 모든 [env:...] 에 상속됨
; # -----------------------------------------------------------------
; [env]
; platform = ststm32
; board = nucleo_f103rb
; ; board = genericSTM32F103R6
; framework = stm32cube

; build_type = debug
; build_flags = -Wl,-Map,${BUILD_DIR}/firmware.map

; # 통신 속도 지정 (앞서 터미널이 9600이었으므로 9600 지정, printf 연동 시 115200 권장)
; monitor_speed = 9600

; # -----------------------------------------------------------------
; # ST-Link 시리얼 번호로 보드를 선택하는 공통 템플릿
; #  - 각 보드 env 에서 'extends = stlink_select' 후
; #    custom_stlink_serial / monitor_port 두 값만 지정하면 됨
; #  - ${this.custom_stlink_serial} : 현재 env 에 정의된 custom_stlink_serial 값으로 치환
; #  - 시리얼 번호 확인: pio device list  ->  "VID:PID=0483:374B SER=..." 항목
; #  - OpenOCD 0.12 이상은 'adapter serial' 사용 (구버전의 'hla_serial' 대체)
; # -----------------------------------------------------------------
; [stlink_select]
; upload_protocol = stlink

; # 자리표시자(빈 값): 실제 값은 각 [env:...] 에서 덮어씀
; custom_stlink_serial =

; # 업로드(OpenOCD)용: 이 플래그는 OpenOCD 인자 맨 앞에 붙음 (-f board/... 보다 먼저 적용)
; upload_flags =
;     -c
;     adapter serial ${this.custom_stlink_serial}

; # 디버그(F5)용: upload_flags 는 디버그 서버에 적용되지 않으므로 별도로 지정
; debug_tool = stlink
; debug_server =
;     ${platformio.packages_dir}/tool-openocd/bin/openocd
;     -s
;     ${platformio.packages_dir}/tool-openocd/openocd/scripts
;     -c
;     adapter serial ${this.custom_stlink_serial}
;     -f
;     board/st_nucleo_f103rb.cfg

; # -----------------------------------------------------------------
; # 보드 목록: 보드를 추가할 때는 아래 블록을 복사해 이름/시리얼/COM 만 수정
; #  - 사용: pio run -e Lecture -t upload  /  pio device monitor -e myProject
