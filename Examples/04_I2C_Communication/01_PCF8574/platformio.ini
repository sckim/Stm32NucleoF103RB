[platformio]
# 사용자가 작성한 메인 소스 위치 지정
src_dir = Core/Src
include_dir = Core/Inc

[env:nucleo_f103rb]
platform = ststm32
board = nucleo_f103rb
framework = stm32cube

build_flags =
    -ICore/Inc

# -----------------------------------------------------------------
# 시리얼 모니터 관련 직접 설정 구역
# -----------------------------------------------------------------
# 모니터링할 포트를 COM5로 강제 지정
monitor_port = COM5

# 통신 속도 지정 (앞서 터미널이 9600이었으므로 9600 지정, printf 연동 시 115200 권장)
monitor_speed = 115200

# PCF8574 LCD 구동을 위한 최적화된 독립 라이브러리 자동 빌드 등록
lib_deps =
    https://github.com/alixahedi/I2C-LCD-STM32.git