[platformio]
; 사용자 소스/헤더 위치 (기존 예제와 동일한 CubeMX 스타일 배치)
src_dir = Core/Src
include_dir = Core/Inc

[env:nucleo_f103rb]
platform = ststm32
board = nucleo_f103rb
framework = stm32cube
debug_tool = stlink
upload_protocol = stlink
build_flags =
    -Wall
    -ICore/Inc
    -DUSE_HAL_DRIVER

monitor_port = COM9
monitor_speed = 115200

# PCF8574 LCD 구동을 위한 최적화된 독립 라이브러리 자동 빌드 등록
lib_deps =
    https://github.com/alixahedi/I2C-LCD-STM32.git
