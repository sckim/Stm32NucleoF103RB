[platformio]
; 사용자 소스/헤더 위치 (이 예제는 .ioc의 MainLocation=Src 이므로 Core/ 없이 루트에 Src/Inc 배치)
src_dir = Src
include_dir = Inc

[env:nucleo_f103rb]
platform = ststm32
board = nucleo_f103rb
framework = stm32cube
debug_tool = stlink
upload_protocol = stlink
build_flags =
    -Wall
    -IInc
    -DUSE_HAL_DRIVER

monitor_port = COM9
monitor_speed = 115200
