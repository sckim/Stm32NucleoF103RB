[platformio]
# 사용자가 작성한 메인 소스 위치 지정
src_dir = Core/Src
include_dir = Core/Inc

[env:nucleo_f103rb]
platform = ststm32
; board = nucleo_f103rb
board = genericSTM32F103R6
framework = stm32cube

# CubeMX가 생성한 main.h 및 고유 설정 헤더들을 내장 HAL과 연동하기 위한 필수 플래그
build_flags =
    -ICore/Inc

# -----------------------------------------------------------------
# 시리얼 모니터 관련 직접 설정 구역
# -----------------------------------------------------------------
# 모니터링할 포트를 COM5로 강제 지정
monitor_port = COM5

# 통신 속도 지정 (앞서 터미널이 9600이었으므로 9600 지정, printf 연동 시 115200 권장)
monitor_speed = 115200