[platformio]
; 사용자 소스/헤더 위치 (기존 예제와 동일한 CubeMX 스타일 배치)
src_dir = Core/Src
include_dir = Core/Inc

[env:nucleo_f103rb]
platform = ststm32
board = nucleo_f103rb
framework = stm32cube
debug_tool = stlink
upload_protocol = stlink
monitor_speed = 115200
build_flags =
    -Wall
    -ICore/Inc
    -DUSE_HAL_DRIVER

; 노드 번호: 보드 A 는 0, 보드 B 는 1 로 바꿔서 각각 빌드/업로드한다 (송신 ID = 0x100 + NODE_ID)
;   build_flags 에 -DNODE_ID=1 을 추가하면 된다.  (기본값 0)
